name:  Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      prelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: './Zinc/Zinc.csproj'

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: x64
            runs-on: windows-latest
            runtime: win-x64
            output_name: Windows-x64
          - os: windows
            arch: arm64
            runs-on: windows-latest
            runtime: win-arm64
            output_name: Windows-arm64
          
          - os: linux
            arch: x64
            runs-on: ubuntu-latest
            runtime: linux-x64
            output_name: Linux-x64
          - os: linux
            arch: arm64
            runs-on: ubuntu-latest
            runtime: linux-arm64
            output_name: Linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
     
      - name: Extract Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}' -replace '^v',''
          }
          Write-Host "Version: $v"
          "version=$v" >> $env:GITHUB_OUTPUT
      
      - name: Publish App
        shell: pwsh
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            -c Release `
            -r ${{ matrix.runtime }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o ./publish
  
      - name: Archive
        shell: pwsh
        run: |
          $out = "Zinc_app_${{ matrix.os }}_${{matrix.arch}}_${{ steps.ver.outputs.version }}_selfContained.zip"
          Compress-Archive -Path ./publish/* -DestinationPath $out
          Write-Host "Created $out"
  
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: Zinc_${{ matrix.os }}_${{ matrix.arch }}_*.zip
  
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: '*'
          merge-multiple: true

      # 1. 自动计算 SHA512，生成 Markdown 表格
      - name: Generate Checksum Table
        run: |
          echo "## 📦 校验和（SHA512）" > checksums_table.md
          echo "" >> checksums_table.md
          echo "| 文件名 | SHA512 |" >> checksums_table.md
          echo "|--------|--------|" >> checksums_table.md
          
          for f in ./artifacts/*; do
            [ -f "$f" ] || continue
            fname=$(basename "$f")
            hash=$(sha512sum "$f" | awk '{print $1}')
            echo "| \`$fname\` | \`$hash\` |" >> checksums_table.md
          done
          
          echo "" >> checksums_table.md
          echo "> 下载后请核对 SHA512 校验和。" >> checksums_table.md
          
          echo "=== 生成的表格 ==="
          cat checksums_table.md

      # 2. 先创建 Draft Release，让 GitHub 自动生成上半部分变更日志
      - name: Create Draft Release (Auto Notes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 统一 Tag 格式（自动加 v 前缀）
          if [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            VER="${{ github.event.inputs.version }}"
            case "$VER" in v*) TAG="$VER" ;; *) TAG="v$VER" ;; esac
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          
          gh release create "$TAG" \
            --draft \
            --repo ${{ github.repository }} \
            --generate-notes \
            --title "$TAG"
          
          # 获取 GitHub 自动生成的 body
          gh release view "$TAG" --repo ${{ github.repository }} --json body -q .body > auto_notes.md

      # 3. 合并：自动变更日志 + SHA512 表格，更新 Release
      - name: Merge & Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat auto_notes.md > final_notes.md
          echo "" >> final_notes.md
          cat checksums_table.md >> final_notes.md
          
          gh release edit "$TAG" --repo ${{ github.repository }} --notes-file final_notes.md

      # 4. 上传产物
      - name: Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in ./artifacts/*; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --repo ${{ github.repository }}
          done