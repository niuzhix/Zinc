name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0 或 v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: './Zinc/Zinc.csproj'

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: x64
            runs-on: windows-latest
            runtime: win-x64
          - os: windows
            arch: arm64
            runs-on: windows-latest
            runtime: win-arm64
          - os: linux
            arch: x64
            runs-on: ubuntu-latest
            runtime: linux-x64
          - os: linux
            arch: arm64
            runs-on: ubuntu-latest
            runtime: linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $raw = '${{ github.event.inputs.version }}'
          } else {
            $raw = '${{ github.ref_name }}'
          }
          $ver = $raw -replace '^v',''
          $tag = $ver
          if (-not $tag.StartsWith('v')) { $tag = 'v' + $tag }

          Write-Host "MSBuild Version: $ver"
          Write-Host "Git Tag: $tag"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish App
        shell: pwsh
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            -c Release `
            -r ${{ matrix.runtime }} `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.ver.outputs.version }} `
            -o ./publish

      - name: Archive
        shell: pwsh
        run: |
          $out = "Zinc_app_${{ matrix.os }}_${{ matrix.arch }}_${{ steps.ver.outputs.version }}_selfContained.zip"
          Compress-Archive -Path ./publish/* -DestinationPath $out
          Write-Host "Created $out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: Zinc_app_${{ matrix.os }}_${{ matrix.arch }}_${{ steps.ver.outputs.version }}_selfContained.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: '*'
          merge-multiple: true

      - name: Generate Release Notes & Checksums
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE=""
          fi

          FEATS=$(git log $RANGE --pretty=format:"%s" --reverse | grep -E '^feat(\([^)]*\))?!?:' || true)
          FIXES=$(git log $RANGE --pretty=format:"%s" --reverse | grep -E '^fix(\([^)]*\))?!?:' || true)
          DOCS=$(git log $RANGE --pretty=format:"%s" --reverse | grep -E '^docs(\([^)]*\))?!?:' || true)
          CI=$(git log $RANGE --pretty=format:"%s" --reverse | grep -E '^ci(\([^)]*\))?!?:' || true)
          OTHER=$(git log $RANGE --pretty=format:"%s" --reverse | grep -Ev '^(feat|fix|docs|ci|chore|style|refactor|perf|test)(\([^)]*\))?!?:' || true)

          fmt() {
            local scope=$(echo "$1" | sed -E 's/^(feat|fix|docs|ci|chore|style|refactor|perf|test)\(([^)]*)\)!?:.*/\2/; t; d')
            local body=$(echo "$1" | sed -E 's/^(feat|fix|docs|ci|chore|style|refactor|perf|test)(\(([^)]*)\))?!?: *//')
            if [ -n "$scope" ]; then
              echo "- 【${scope}】${body}"
            else
              echo "- ${body}"
            fi
          }

          {
            echo "## 🚀 新增功能与优化"
            if [ -n "$FEATS" ]; then
              echo "$FEATS" | while read -r line; do [ -n "$line" ] && fmt "$line"; done
            else
              echo "- 无"
            fi

            echo ""
            echo "## 🐛 Bug 修复"
            if [ -n "$FIXES" ]; then
              echo "$FIXES" | while read -r line; do [ -n "$line" ] && fmt "$line"; done
            else
              echo "- 无"
            fi

            if [ -n "$DOCS" ]; then
              echo ""
              echo "## 📝 文档"
              echo "$DOCS" | while read -r line; do [ -n "$line" ] && fmt "$line"; done
            fi

            if [ -n "$CI" ]; then
              echo ""
              echo "## 🔧 构建与工程"
              echo "$CI" | while read -r line; do [ -n "$line" ] && fmt "$line"; done
            fi

            if [ -n "$OTHER" ]; then
              echo ""
              echo "## 📌 其他"
              echo "$OTHER" | while read -r line; do [ -n "$line" ] && echo "- ${line}"; done
            fi
          } > notes.md

          {
            echo ""
            echo "## 📦 校验和（SHA512）"
            echo ""
            echo "| 文件名 | SHA512 |"
            echo "|--------|--------|"
            for f in ./artifacts/*; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              hash=$(sha512sum "$f" | awk '{print $1}')
              echo "| \`${fname}\` | \`${hash}\` |"
            done
            echo ""
            echo "> [!IMPORTANT] Caution  "
            echo "> 下载后请核对 SHA512 校验和。"
          } >> notes.md

          echo "=== Generated Release Notes ==="
          cat notes.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          IS_PRE="${{ github.event.inputs.prerelease || 'false' }}"

          PRE_ARGS=""
          if [ "$IS_PRE" = "true" ]; then
            PRE_ARGS="--prerelease"
          fi

          gh release create "$TAG" ./artifacts/* \
            --draft \
            --repo ${{ github.repository }} \
            --title "$TAG" \
            --notes-file notes.md \
            $PRE_ARGS